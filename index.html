const page=document.getElementById('page');
const tabs={home:document.getElementById('homeTab'),relation:document.getElementById('relationTab')};
function decode64(value){const raw=atob(value),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
function showPage(name){if(!DATA[name])return;Object.entries(tabs).forEach(([key,button])=>{const active=key===name;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});page.srcdoc=decode64(DATA[name]);try{localStorage.setItem('xingqi-active-page',name)}catch(e){}}
tabs.home.addEventListener('click',()=>showPage('home'));tabs.relation.addEventListener('click',()=>showPage('relation'));
showPage('home');
